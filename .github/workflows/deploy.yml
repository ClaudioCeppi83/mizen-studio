name: 🚀 MIZEN Studio — Quality Gate & Firebase Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 🛡️ Audit, Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Cloud Functions Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Static Analysis & Hygiene Check (Oxlint)
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Run Cloud Functions Tests (Vitest)
        working-directory: ./functions
        run: npm test

      - name: Build Cloud Functions Bundle
        working-directory: ./functions
        run: npm run build

      - name: Build Frontend Production Bundle (Vite)
        run: npm run build

  deploy-preview:
    name: 🌐 Firebase Hosting Preview Channel
    needs: quality-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIZEN_STUDIO_OS }}'
          projectId: mizen-studio-os-21dd9

  deploy-production:
    name: 🚀 Deploy to Production (mizen-studio-os)
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd functions && npm ci && cd ..

      - name: Compile Functions & Production Bundle
        run: |
          cd functions && npm run build && cd ..
          npm run build

      - name: Deploy Production Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIZEN_STUDIO_OS }}'
          channelId: live
          projectId: mizen-studio-os-21dd9

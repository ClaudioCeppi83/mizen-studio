<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- MIZEN Trust Badge: Engineered For Service - Modo Claro -->
  <style>
    .badge-mono { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 2px; font-weight: 600; }
  </style>

  <!-- Anillo Exterior Técnico Dentado / Octagonal -->
  <circle cx="80" cy="80" r="74" stroke="#E2E4E9" stroke-width="2"/>
  <circle cx="80" cy="80" r="69" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Fondo Central -->
  <circle cx="80" cy="80" r="54" fill="#FFFFFF" stroke="#E2E4E9" stroke-width="1.5"/>

  <!-- Símbolo MIZEN Miniatura -->
  <g transform="translate(80, 78) scale(0.42) translate(-65, -55)">
    <polygon points="10,10 38,10 38,90 10,75" fill="#111827"/>
    <polygon points="92,10 120,10 120,75 92,90" fill="#111827"/>
    <polygon points="38,10 65,58 92,10 65,30" fill="#111827"/>
    <polygon points="65,30 65,58 92,10" fill="#4B5563" opacity="0.3"/>
    <circle cx="65" cy="88" r="11" fill="#D97706"/>
  </g>

  <!-- Texto Circular Arriba y Abajo -->
  <path id="curveTopServiceLight" d="M 22,80 A 58,58 0 0,1 138,80" fill="none"/>
  <text fill="#111827" class="badge-mono">
    <textPath href="#curveTopServiceLight" startOffset="50%" text-anchor="middle">ENGINEERED FOR SERVICE</textPath>
  </text>

  <path id="curveBottomServiceLight" d="M 138,80 A 58,58 0 0,1 22,80" fill="none"/>
  <text fill="#D97706" class="badge-mono">
    <textPath href="#curveBottomServiceLight" startOffset="50%" text-anchor="middle">ZERO OPERATIONAL FRICTION</textPath>
  </text>
</svg>

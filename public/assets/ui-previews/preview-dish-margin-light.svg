<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" fill="none">
  <!-- MIZEN UI Preview: Escandallo en Tiempo Real - Modo Claro -->
  <style>
    .mono { font-family: 'Geist Mono', monospace; }
    .sans { font-family: 'Geist', sans-serif; }
  </style>

  <!-- Tarjeta Contenedora -->
  <rect x="1" y="1" width="418" height="278" rx="6" fill="#FFFFFF" stroke="#E2E4E9" stroke-width="1.5"/>

  <!-- Cabecera -->
  <path d="M1 1 L419 1 L419 50 L1 50 Z" fill="#F4F4F6"/>
  <line x1="1" y1="50" x2="419" y2="50" stroke="#E2E4E9" stroke-width="1.5"/>

  <text x="20" y="32" class="sans" font-size="13" font-weight="600" fill="#111827">FICHA TÉCNICA · ESCANDALLO</text>
  <rect x="270" y="14" width="130" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="335" y="29" class="mono" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">MARGEN: 77,3%</text>

  <!-- Nombre del Plato y Categoría -->
  <text x="20" y="78" class="mono" font-size="11" fill="#4B5563">PLATO PRINCIPAL · PARTIDA DE FRÍO</text>
  <text x="20" y="102" class="sans" font-size="18" font-weight="700" fill="#111827">Tártar de Atún Rojo Balfegó</text>

  <!-- Comparativa Coste vs Venta -->
  <g transform="translate(20, 118)">
    <rect x="0" y="0" width="180" height="54" rx="4" fill="#F4F4F6" stroke="#E2E4E9" stroke-width="1"/>
    <text x="12" y="20" class="sans" font-size="11" fill="#4B5563">Coste Ingredientes (Food Cost)</text>
    <text x="12" y="42" class="mono" font-size="18" font-weight="600" fill="#111827">4,20 €<tspan font-size="11" fill="#4B5563"> (22,7%)</tspan></text>

    <rect x="200" y="0" width="180" height="54" rx="4" fill="#F4F4F6" stroke="#E2E4E9" stroke-width="1"/>
    <text x="212" y="20" class="sans" font-size="11" fill="#4B5563">PVP Recomendado (Carta)</text>
    <text x="212" y="42" class="mono" font-size="18" font-weight="600" fill="#16A34A">18,50 €</text>
  </g>

  <!-- Desglose de Ingredientes con Barras -->
  <g transform="translate(20, 192)">
    <text x="0" y="0" class="mono" font-size="10" fill="#4B5563">DESGLOSE DE MATERIA PRIMA (180g neto)</text>
    
    <!-- Barra Segmentada Visual -->
    <rect x="0" y="10" width="240" height="8" rx="2" fill="#D97706"/>
    <rect x="244" y="10" width="80" height="8" rx="2" fill="#9CA3AF"/>
    <rect x="328" y="10" width="52" height="8" rx="2" fill="#E2E4E9"/>
  </g>

  <!-- Footer con Beneficio Neto por Ración -->
  <path d="M1 236 L419 236 L419 279 L1 279 Z" fill="#F4F4F6"/>
  <line x1="1" y1="236" x2="419" y2="236" stroke="#E2E4E9" stroke-width="1.5"/>

  <text x="20" y="260" class="sans" font-size="12" fill="#4B5563">Beneficio bruto unitario:</text>
  <text x="175" y="260" class="mono" font-size="13" font-weight="700" fill="#16A34A">+14,30 € / pase</text>
  <rect x="310" y="246" width="90" height="24" rx="4" fill="#FFFFFF" stroke="#E2E4E9" stroke-width="1"/>
  <text x="355" y="262" class="mono" font-size="11" font-weight="500" fill="#111827" text-anchor="middle">EDITAR</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" fill="none">
  <!-- MIZEN UI Preview: Arqueo de Caja y Cierre de Turno - Modo Oscuro -->
  <style>
    .mono { font-family: 'Geist Mono', monospace; }
    .sans { font-family: 'Geist', sans-serif; }
  </style>

  <!-- Tarjeta Contenedora -->
  <rect x="1" y="1" width="418" height="278" rx="6" fill="#161922" stroke="#2B313E" stroke-width="1.5"/>

  <!-- Cabecera -->
  <path d="M1 1 L419 1 L419 48 L1 48 Z" fill="#0E1117"/>
  <line x1="1" y1="48" x2="419" y2="48" stroke="#2B313E" stroke-width="1.5"/>

  <text x="20" y="30" class="sans" font-size="13" font-weight="600" fill="#F3F4F6">CIERRE DE TURNO · MEDIODÍA</text>
  <rect x="290" y="14" width="110" height="22" rx="4" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" stroke-width="1"/>
  <text x="345" y="29" class="mono" font-size="11" font-weight="600" fill="#22C55E" text-anchor="middle">TURNO CERRADO</text>

  <!-- Total Facturado Display -->
  <text x="20" y="78" class="mono" font-size="11" fill="#9CA3AF">TOTAL RECAUDADO (BRUTO)</text>
  <text x="20" y="116" class="mono" font-size="34" font-weight="700" fill="#F3F4F6">3.480,50<tspan font-size="20" fill="#F59E0B"> €</tspan></text>

  <!-- Cuadrícula de Desglose de Cobro -->
  <g transform="translate(20, 134)">
    <!-- Columna 1: Tarjetas -->
    <rect x="0" y="0" width="180" height="60" rx="4" fill="#0E1117" stroke="#2B313E" stroke-width="1"/>
    <text x="12" y="22" class="sans" font-size="11" fill="#9CA3AF">TPV / Tarjeta (81,6%)</text>
    <text x="12" y="46" class="mono" font-size="17" font-weight="600" fill="#F3F4F6">2.840,00 €</text>

    <!-- Columna 2: Efectivo -->
    <rect x="200" y="0" width="180" height="60" rx="4" fill="#0E1117" stroke="#2B313E" stroke-width="1"/>
    <text x="212" y="22" class="sans" font-size="11" fill="#9CA3AF">Efectivo en Cajón (18,4%)</text>
    <text x="212" y="46" class="mono" font-size="17" font-weight="600" fill="#F3F4F6">640,50 €</text>
  </g>

  <!-- Auditoría de Discrepancia / Footer -->
  <path d="M1 216 L419 216 L419 279 L1 279 Z" fill="#0E1117"/>
  <line x1="1" y1="216" x2="419" y2="216" stroke="#2B313E" stroke-width="1.5"/>

  <!-- Estado Cuadre -->
  <circle cx="30" cy="248" r="8" fill="#22C55E" fill-opacity="0.2"/>
  <circle cx="30" cy="248" r="3.5" fill="#22C55E"/>
  <text x="48" y="246" class="sans" font-size="12" font-weight="600" fill="#F3F4F6">Discrepancia de caja: <tspan class="mono" fill="#22C55E">0,00 €</tspan></text>
  <text x="48" y="262" class="mono" font-size="10" fill="#9CA3AF">AUDITORÍA: 48 TICKETS EMITIDOS · 0 ANULACIONES</text>

  <!-- Botón Exportar Resumen -->
  <rect x="300" y="234" width="100" height="28" rx="4" fill="#161922" stroke="#4B5563" stroke-width="1"/>
  <text x="350" y="252" class="mono" font-size="11" font-weight="500" fill="#F3F4F6" text-anchor="middle">DESCARGAR</text>
</svg>

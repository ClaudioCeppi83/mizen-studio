<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- MIZEN Operational Systems: Analytics Chart (Métricas de Servicio) - Modo Oscuro -->
  <g stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Marco del Panel Analítico -->
    <rect x="18" y="18" width="84" height="84" rx="6" fill="#161922"/>
    
    <!-- Eje Base y Líneas de Rejilla -->
    <line x1="26" y1="84" x2="94" y2="84" stroke="#4B5563" stroke-width="2"/>
    <line x1="26" y1="62" x2="94" y2="62" stroke="#2B313E" stroke-dasharray="3 3" stroke-width="1.5"/>
    <line x1="26" y1="40" x2="94" y2="40" stroke="#2B313E" stroke-dasharray="3 3" stroke-width="1.5"/>

    <!-- Barras de Ocupación por Franja Horaria -->
    <rect x="32" y="60" width="10" height="24" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="48" y="46" width="10" height="38" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="64" y="32" width="10" height="52" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="80" y="50" width="10" height="34" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
  </g>

  <!-- Curva de Tendencia de Facturación en Kitchen Amber -->
  <path d="M37 54 L53 42 L69 28 L85 44" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="69" cy="28" r="3.5" fill="#F59E0B"/>
</svg>

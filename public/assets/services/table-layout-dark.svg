<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- MIZEN Operational Systems: Table Layout (Sala/Mesas) - Modo Oscuro -->
  <g stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mesa Central -->
    <rect x="36" y="36" width="48" height="48" rx="6" fill="#161922"/>
    
    <!-- Sillas / Asientos Modulares (Pills) -->
    <!-- Asiento Superior -->
    <rect x="44" y="16" width="32" height="12" rx="6" fill="#0E1117"/>
    <!-- Asiento Inferior -->
    <rect x="44" y="92" width="32" height="12" rx="6" fill="#0E1117"/>
    <!-- Asiento Izquierdo -->
    <rect x="16" y="44" width="12" height="32" rx="6" fill="#0E1117"/>
    <!-- Asiento Derecho -->
    <rect x="92" y="44" width="12" height="32" rx="6" fill="#0E1117"/>
  </g>
  
  <!-- Indicador Operativo Kitchen Amber (Mesa Activa / En Servicio) -->
  <circle cx="60" cy="60" r="5" fill="#F59E0B"/>
</svg>

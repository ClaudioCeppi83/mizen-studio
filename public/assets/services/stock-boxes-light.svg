<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- MIZEN Operational Systems: Stock Boxes (Inventario / Almacén) - Modo Claro -->
  <g stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Caja Base Izquierda -->
    <rect x="18" y="54" width="40" height="48" rx="4" fill="#FFFFFF"/>
    <line x1="18" y1="64" x2="58" y2="64" stroke="#9CA3AF" stroke-width="2"/>

    <!-- Caja Base Derecha -->
    <rect x="62" y="54" width="40" height="48" rx="4" fill="#FFFFFF"/>
    <line x1="62" y1="64" x2="102" y2="64" stroke="#9CA3AF" stroke-width="2"/>

    <!-- Caja Superior Apilada -->
    <rect x="36" y="18" width="48" height="36" rx="4" fill="#FFFFFF"/>
    <line x1="36" y1="28" x2="84" y2="28" stroke="#9CA3AF" stroke-width="2"/>

    <!-- Asas / Ranuras de Agarre Industrial -->
    <rect x="32" y="72" width="12" height="5" rx="2.5" stroke="#9CA3AF" stroke-width="1.5" fill="#F4F4F6"/>
    <rect x="76" y="72" width="12" height="5" rx="2.5" stroke="#9CA3AF" stroke-width="1.5" fill="#F4F4F6"/>

    <!-- Código de Barras / Trazabilidad Caja Izquierda -->
    <line x1="26" y1="86" x2="26" y2="93" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="31" y1="86" x2="31" y2="93" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="36" y1="86" x2="36" y2="93" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="42" y1="86" x2="42" y2="93" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="48" y1="86" x2="48" y2="93" stroke="#9CA3AF" stroke-width="2.5"/>

    <!-- Indicador de Nivel / Lote Caja Derecha -->
    <line x1="72" y1="85" x2="92" y2="85" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="72" y1="91" x2="84" y2="91" stroke="#9CA3AF" stroke-width="2"/>
  </g>

  <!-- Etiqueta Técnica de Lote / Batch en Kitchen Amber -->
  <rect x="48" y="34" width="24" height="12" rx="2" stroke="#D97706" stroke-width="2" fill="#D97706" fill-opacity="0.15"/>
  <line x1="53" y1="40" x2="67" y2="40" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
</svg>

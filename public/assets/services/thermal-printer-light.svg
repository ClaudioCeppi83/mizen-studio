<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- MIZEN Operational Systems: Thermal Printer (Hardware / Tickets) - Modo Claro -->
  <g stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Carcasa Industrial de la Impresora -->
    <rect x="24" y="44" width="72" height="56" rx="6" fill="#FFFFFF"/>
    
    <!-- Tapa Frontal y Bisagra -->
    <line x1="24" y1="62" x2="96" y2="62" stroke="#9CA3AF" stroke-width="2"/>
    
    <!-- Ranura de Emisión de Ticket -->
    <rect x="36" y="40" width="48" height="8" rx="2" fill="#F4F4F6" stroke="#9CA3AF" stroke-width="1.5"/>

    <!-- Papel Térmico Continuo Saliendo -->
    <path d="M42 40 L42 18 L78 18 L78 40" fill="#FFFFFF"/>
    <line x1="48" y1="26" x2="72" y2="26" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="48" y1="32" x2="66" y2="32" stroke="#9CA3AF" stroke-width="1.5"/>

    <!-- Botón de Alimentación (Feed) -->
    <rect x="36" y="74" width="20" height="8" rx="2" fill="#F4F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <!-- LED de Estado Operativo / Conexión LAN en Kitchen Amber -->
  <circle cx="78" cy="78" r="3.5" fill="#D97706"/>
</svg>

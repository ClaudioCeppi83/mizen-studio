    <!-- Chasis del Monitor VESA -->
    <rect x="18" y="22" width="84" height="62" rx="5" fill="#161922"/>
    
    <!-- Soporte VESA de Acero Inoxidable -->
    <path d="M52 84 L48 98 L72 98 L68 84" fill="#0E1117"/>
    <line x1="42" y1="98" x2="78" y2="98" stroke-width="3"/>

    <!-- Tarjeta de Comanda 1 (Izquierda - Espera) -->
    <rect x="24" y="30" width="20" height="38" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="28" y1="36" x2="38" y2="36" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="28" y1="42" x2="40" y2="42" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="28" y1="48" x2="38" y2="48" stroke="#4B5563" stroke-width="1.5"/>


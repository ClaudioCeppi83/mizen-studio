    <line x1="80" y1="36" x2="90" y2="36" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="80" y1="42" x2="92" y2="42" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="80" y1="48" x2="88" y2="48" stroke="#4B5563" stroke-width="1.5"/>

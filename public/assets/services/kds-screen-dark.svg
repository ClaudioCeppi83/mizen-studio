    <rect x="50" y="30" width="20" height="38" rx="2" fill="#0E1117" stroke="#F59E0B" stroke-width="2"/>
    <line x1="54" y1="36" x2="64" y2="36" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="54" y1="42" x2="66" y2="42" stroke="#F3F4F6" stroke-width="1.5"/>
    <line x1="54" y1="48" x2="62" y2="48" stroke="#F3F4F6" stroke-width="1.5"/>


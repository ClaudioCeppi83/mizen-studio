<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- MIZEN Operational Systems: Order Receipt (Ticket) - Modo Oscuro -->
  <g stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contorno del Ticket -->
    <path d="M32 18 C32 15 35 12 38 12 L82 12 C85 12 88 15 88 18 L88 104 L81 100 L74 104 L67 100 L60 104 L53 100 L46 104 L39 100 L32 104 Z" 
          fill="#161922"/>
    
    <!-- Cabecera de Ticket -->
    <line x1="42" y1="28" x2="62" y2="28" stroke="#9CA3AF" stroke-width="2"/>
    
    <!-- Líneas de Comanda -->
    <line x1="42" y1="42" x2="78" y2="42" stroke="#4B5563" stroke-width="2"/>
    <line x1="42" y1="54" x2="78" y2="54" stroke="#4B5563" stroke-width="2"/>
    <line x1="42" y1="66" x2="68" y2="66" stroke="#4B5563" stroke-width="2"/>
    
    <!-- Divisor Técnico -->
    <line x1="40" y1="78" x2="80" y2="78" stroke="#2B313E" stroke-dasharray="3 3" stroke-width="1.5"/>
    
    <!-- Total Importe / Código de Pase -->
    <line x1="42" y1="88" x2="65" y2="88" stroke="#F3F4F6" stroke-width="2.5"/>
  </g>
  
  <!-- Punto de Atención Kitchen Amber (Estado Comanda) -->
  <circle cx="76" cy="28" r="3.5" fill="#F59E0B"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- MIZEN Operational Systems: Table Reservation (Turnos y Aforo) - Modo Oscuro -->
  <g stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Marco del Gestor de Reservas -->
    <rect x="20" y="20" width="80" height="80" rx="6" fill="#161922"/>
    
    <!-- Cabecera de Fecha / Turno Activo -->
    <path d="M20 20 L100 20 L100 36 L20 36 Z" fill="#0E1117"/>
    <line x1="20" y1="36" x2="100" y2="36" stroke-width="2"/>
    <line x1="32" y1="28" x2="52" y2="28" stroke="#9CA3AF" stroke-width="2"/>

    <!-- Anillas Superiores del Calendario Operativo -->
    <line x1="36" y1="14" x2="36" y2="22" stroke-width="3"/>
    <line x1="84" y1="14" x2="84" y2="22" stroke-width="3"/>

    <!-- Fila Reserva 1 (13:30h - Confirmada) -->
    <rect x="28" y="44" width="46" height="10" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
    <circle cx="86" cy="49" r="3.5" fill="#22C55E" stroke="none"/>

    <!-- Fila Reserva 2 (15:00h - En Espera / Doble Turno) -->
    <rect x="28" y="60" width="46" height="10" rx="2" fill="#0E1117" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="86" cy="65" r="3.5" fill="#F59E0B" stroke="none"/>

    <!-- Fila Reserva 3 (21:00h - Turno Noche) -->
    <rect x="28" y="76" width="46" height="10" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
    <circle cx="86" cy="81" r="3.5" fill="#4B5563" stroke="none"/>
  </g>
</svg>

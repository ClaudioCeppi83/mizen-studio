<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- MIZEN Operational Systems: Recipe Costing & Precision Scale (Escandallos) - Modo Oscuro -->
  <g stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Plato de Pesaje / Bandeja de Acero -->
    <path d="M26 36 L94 36 L86 44 L34 44 Z" fill="#161922"/>
    
    <!-- Cuello del Sensor de Carga -->
    <rect x="54" y="44" width="12" height="24" fill="#0E1117"/>
    <line x1="54" y1="56" x2="66" y2="56" stroke="#4B5563" stroke-width="1.5"/>

    <!-- Base / Chasis Industrial -->
    <path d="M22 68 L98 68 L104 96 L16 96 Z" fill="#161922"/>
    <line x1="16" y1="96" x2="104" y2="96" stroke-width="3"/>

    <!-- Visor Digital de Gramajes / Ratio de Escandallo -->
    <rect x="38" y="76" width="44" height="13" rx="2" fill="#0E1117" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="44" y1="82" x2="58" y2="82" stroke="#F3F4F6" stroke-width="1.5"/>
    <line x1="64" y1="82" x2="72" y2="82" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <!-- Botón de Tara / Indicador Kitchen Amber -->
  <circle cx="88" cy="82" r="3" fill="#F59E0B"/>
  <!-- Línea de Calibración Superior en Kitchen Amber -->
  <line x1="48" y1="26" x2="72" y2="26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
</svg>

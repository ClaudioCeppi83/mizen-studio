<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(400, 260)">
    <g transform="scale(2.2) translate(-65, -80)">
      <polygon points="10,10 38,10 38,90 10,75" fill="#F3F4F6"/>
      <polygon points="92,10 120,10 120,75 92,90" fill="#F3F4F6"/>
      <polygon points="38,10 65,58 92,10 65,30" fill="#F3F4F6"/>
      <polygon points="65,30 65,58 92,10" fill="#E2E4E9" opacity="0.85"/>
      <circle cx="65" cy="88" r="11" fill="#F59E0B" filter="url(#softGlow)"/>
    </g>

    <text x="0" y="210" font-family="Geist, sans-serif" font-weight="700" font-size="44" fill="#F3F4F6" letter-spacing="10" text-anchor="middle">MIZEN<tspan fill="#F59E0B">.</tspan></text>
    <text x="0" y="250" font-family="Geist, sans-serif" font-weight="500" font-size="12" fill="#9CA3AF" letter-spacing="8" text-anchor="middle">OPERATIONAL SYSTEMS</text>
  </g>
</svg>

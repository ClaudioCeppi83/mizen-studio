<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 80" width="540" height="80" fill="none">
  <defs>
    <filter id="softGlowLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Isotipo MIZEN (M + Amber Dot) -->
  <g transform="translate(10, 2) scale(0.85)">
    <polygon points="10,10 38,10 38,85 10,72" fill="#111827"/>
    <polygon points="92,10 120,10 120,72 92,85" fill="#111827"/>
    <polygon points="38,10 65,56 92,10 65,28" fill="#111827"/>
    <polygon points="65,28 65,56 92,10" fill="#1F2937"/>
    <circle cx="65" cy="85" r="11" fill="#D97706" filter="url(#softGlowLight)"/>
  </g>

  <!-- Logotipo Horizontal -->
  <g transform="translate(130, 48)">
    <text font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="34" 
          fill="#111827" 
          letter-spacing="5">MIZEN<tspan fill="#D97706">.</tspan></text>
    <text x="210" y="-3" 
          font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="500" 
          font-size="12" 
          fill="#4B5563" 
          letter-spacing="4">OPERATIONAL SYSTEMS</text>
  </g>
</svg>

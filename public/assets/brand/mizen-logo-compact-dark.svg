<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <filter id="softGlowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(4, 2) scale(0.68)">
    <polygon points="10,10 38,10 38,85 10,72" fill="#F3F4F6"/>
    <polygon points="92,10 120,10 120,72 92,85" fill="#F3F4F6"/>
    <polygon points="38,10 65,56 92,10 65,28" fill="#F3F4F6"/>
    <polygon points="65,28 65,56 92,10" fill="#E2E4E9" opacity="0.85"/>
    <circle cx="65" cy="85" r="11" fill="#F59E0B" filter="url(#softGlowDark)"/>
  </g>

  <g transform="translate(100, 42)">
    <text font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="28" 
          fill="#F3F4F6" 
          letter-spacing="4">MIZEN<tspan fill="#F59E0B">.</tspan></text>
  </g>
</svg>
